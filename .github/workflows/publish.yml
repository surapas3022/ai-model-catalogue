# Signs the catalogue and puts it where deployments fetch it.
#
# The point of this workflow is not convenience. It is that the private key
# stops living on somebody's laptop: it is a repository secret, build.mjs reads
# it out of CATALOGUE_KEY, and nothing here ever writes it to disk.
#
# Order matters. build.mjs runs first because it is what refuses a bad source;
# verify.mjs runs after it because one of its cases asserts that the published
# file is byte-for-byte what building the source produces, which is only true
# once this run has produced it.
#
# Only `stable` is published automatically. Signing canary from the same source
# at the same moment would make the two files identical but for one word, and a
# canary that carries the same content as stable cannot break first — which is
# the entire reason to have one. Stage a canary with "Run workflow" instead.
name: Publish signed catalogue

on:
  push:
    branches: [main]
    paths:
      - catalogue.src.json
      - lineup.src.json
      - catalogue.schema.json
      - build.mjs
      - verify.mjs
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to sign
        type: choice
        default: stable
        options: [stable, canary]

permissions:
  contents: write

concurrency:
  # Two runs signing at once would race on the version number and on the push.
  group: publish-catalogue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check the signing key is present
        env:
          CATALOGUE_KEY: ${{ secrets.CATALOGUE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CATALOGUE_KEY:-}" ]; then
            echo "::error::secrets.CATALOGUE_PRIVATE_KEY is not set. Paste the whole private PEM into it, BEGIN and END lines included."
            exit 1
          fi

      - name: Decide what to sign
        id: decide
        run: |
          set -euo pipefail

          # The routing catalogue takes the dispatched channel; the lineup is
          # stable-only, because canary exists to break a few deployments first
          # and nothing breaks from a price table nobody routes from.
          echo "targets=" > /tmp/targets

          decide_one () {          # name, source file, output file
            local NAME="$1" SRC="$2" OUT="$3"

            CHANGED=false
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              CHANGED=true
            else
              BEFORE="${{ github.event.before }}"
              if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                CHANGED=true
              elif git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qx "$SRC"; then
                CHANGED=true
              fi
            fi

            # A guard or a schema can change without a catalogue changing, and a
            # source that has not moved cannot be republished: its version is not
            # newer than what is already out there. Those pushes still run
            # verify.mjs below; they just have nothing to publish.
            if [ "$CHANGED" != true ]; then
              echo "$SRC did not change in this push; verifying only."
              return
            fi

            # Whoever raised the version may also have built before committing,
            # which is what README.md tells everyone to do. The generated file is
            # then already correct and already pushed, and signing again would
            # only make build.mjs refuse a version it can see is published — a red
            # run for a release that is, in fact, fine. Take the file as it stands
            # and go straight to purging the edge, which is the one step a local
            # build cannot do for itself.
            SRC_V=$(node -p "JSON.parse(require('fs').readFileSync('$SRC','utf8')).version")
            OUT_V=$(node -p "try{JSON.parse(JSON.parse(require('fs').readFileSync('$OUT','utf8')).payload).version}catch(e){0}")
            if [ "$SRC_V" = "$OUT_V" ]; then
              echo "$OUT already carries version ${SRC_V}; verifying it, then purging."
              echo "$NAME:prebuilt:$OUT" >> /tmp/targets
            else
              echo "$NAME:sign:$OUT" >> /tmp/targets
            fi
          }

          decide_one config "catalogue.src.json" "config.${CHANNEL}.json"
          decide_one lineup "lineup.src.json"    "lineup.stable.json"

          {
            echo "targets<<EOF"
            grep -v '^targets=$' /tmp/targets || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Sign
        env:
          CATALOGUE_KEY: ${{ secrets.CATALOGUE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "${{ steps.decide.outputs.targets }}" | while IFS=: read -r NAME ACTION OUT; do
            [ "$ACTION" = "sign" ] || continue
            if [ "$NAME" = "config" ]; then
              node build.mjs "$CHANNEL"
            else
              node build.mjs --catalogue="$NAME"
            fi
          done

      - name: Verify
        env:
          CATALOGUE_KEY: ${{ secrets.CATALOGUE_PRIVATE_KEY }}
        run: node verify.mjs

      - name: Commit what was signed
        id: commit
        run: |
          set -euo pipefail
          # The repository owner, not a bot: a publish is the owner's release,
          # and the history should say so.
          git config user.name "surapas3022"
          git config user.email "surapas3022@gmail.com"
          echo "${{ steps.decide.outputs.targets }}" | while IFS=: read -r NAME ACTION OUT; do
            [ "$ACTION" = "sign" ] || continue
            git add "$OUT"
          done
          if git diff --cached --quiet; then
            echo "Nothing changed in any generated file."
            exit 0
          fi
          git commit -m "Publish catalogue on ${CHANNEL}"
          git push

      - name: Purge the CDN
        if: steps.decide.outputs.targets != ''
        run: |
          set -euo pipefail
          # Without this the old file keeps being served for hours, and the run
          # above reads as a successful release that reached nobody.
          echo "${{ steps.decide.outputs.targets }}" | while IFS=: read -r NAME ACTION OUT; do
            [ -n "$OUT" ] || continue
            for URL in \
              "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/${OUT}" \
              "https://purge.jsdelivr.net/gh/${{ github.repository }}/${OUT}"
            do
              echo "purging ${URL}"
              curl -fsS "$URL" || echo "::warning::purge failed for ${URL} — the file is published, the edge is just still holding the old one"
              echo
            done
          done
